<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notes</title>
    <link rel="stylesheet" href="./panel.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="toolbar">
          <h2 class="toolbar-title">目录</h2>
          <button
            id="new-btn"
            class="btn btn-primary new-btn"
            type="button"
            title="新建笔记 (Ctrl+N)"
            aria-label="新建笔记"
          >
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <path d="M5 12h14"></path>
              <path d="M12 5v14"></path>
            </svg>
          </button>
        </div>

        <div class="note-list-shell">
          <div
            id="note-list"
            class="note-list"
            role="listbox"
            tabindex="0"
            aria-label="笔记列表"
          >
            <div id="list-empty" class="list-empty" hidden>暂无笔记，按 Ctrl+N 新建</div>
            <div id="note-list-virtual" class="note-list-virtual" hidden>
              <div id="note-list-spacer" class="note-list-spacer"></div>
              <ul id="note-list-viewport" class="note-list-viewport"></ul>
            </div>
          </div>
          <div id="note-list-scrollbar" class="note-list-scrollbar" aria-hidden="true">
            <div id="note-list-scrollbar-thumb" class="note-list-scrollbar-thumb"></div>
          </div>
        </div>
      </aside>

      <section class="editor" aria-label="笔记编辑区">
        <div id="empty-state" class="empty-state">
          <div class="empty-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <path d="M6 14 7.5 11.1A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.54 6a2 2 0 0 1-1.94 1.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.82 1.2A2 2 0 0 0 12.07 6H18a2 2 0 0 1 2 2v2"></path>
            </svg>
          </div>
          <p class="empty-title">还没有选中笔记</p>
          <p class="empty-hint">从左侧选择一条笔记，或按 Ctrl+N 开始记录。搜索请用主输入框并按 Enter。</p>
        </div>

        <div id="editor-panel" class="editor-panel" hidden>
          <header class="editor-header">
            <div class="editor-heading">
              <strong id="editor-title" class="editor-title"></strong>
              <time id="editor-time" class="editor-time"></time>
            </div>
            <span id="editor-save-state" class="editor-save-state">
              <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="m5 12 4 4L19 6"></path>
              </svg>
              <span>已保存</span>
            </span>
          </header>
          <div class="editor-surface">
            <textarea
              id="editor-content"
              class="editor-content"
              spellcheck="false"
              placeholder="在此记录笔记或代码片段…"
            ></textarea>
            <div id="editor-scrollbar" class="editor-scrollbar" aria-hidden="true">
              <div id="editor-scrollbar-thumb" class="editor-scrollbar-thumb"></div>
            </div>
            <button
              id="editor-copy-btn"
              class="editor-copy-button"
              type="button"
              title="复制正文"
              aria-label="复制正文"
            >
              <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <rect width="14" height="14" x="8" y="8" rx="2" ry="2"></rect>
                <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"></path>
              </svg>
            </button>
          </div>
          <span id="editor-status" class="editor-status" role="status" aria-live="polite" aria-atomic="true"></span>
        </div>
      </section>
    </div>

    <div id="note-actions-menu" class="note-actions-menu" role="menu" aria-label="目录操作" hidden>
      <button class="note-action" type="button" role="menuitem" data-note-action="rename">重命名</button>
      <button class="note-action" type="button" role="menuitem" data-note-action="pin">置顶</button>
      <button class="note-action note-action-danger" type="button" role="menuitem" data-note-action="delete">删除</button>
    </div>

    <dialog id="new-dialog" class="dialog">
      <form id="new-form" method="dialog" class="dialog-body">
        <h3 class="dialog-title">新建笔记</h3>
        <input
          id="new-title-input"
          class="text-input"
          type="text"
          aria-label="笔记名称"
          placeholder="例如：项目备忘、代码片段"
          autocomplete="off"
        />
        <div class="dialog-actions">
          <button id="new-save-btn" class="btn btn-primary" type="submit" aria-disabled="true">保存</button>
          <button id="new-cancel-btn" class="btn btn-ghost" type="button">取消</button>
        </div>
      </form>
    </dialog>

    <dialog id="rename-dialog" class="dialog">
      <form id="rename-form" method="dialog" class="dialog-body">
        <h3 class="dialog-title">重命名目录</h3>
        <input
          id="rename-title-input"
          class="text-input"
          type="text"
          aria-label="目录名称"
          autocomplete="off"
        />
        <div class="dialog-actions">
          <button id="rename-save-btn" class="btn btn-primary" type="submit" aria-disabled="true">保存</button>
          <button id="rename-cancel-btn" class="btn btn-ghost" type="button">取消</button>
        </div>
      </form>
    </dialog>

    <dialog id="delete-dialog" class="dialog">
      <form id="delete-form" method="dialog" class="dialog-body">
        <h3 class="dialog-title">确认删除</h3>
        <p id="delete-message" class="dialog-message"></p>
        <div class="dialog-actions">
          <button id="delete-cancel-btn" class="btn btn-ghost" type="button">取消</button>
          <button id="delete-confirm-btn" class="btn btn-danger" type="submit">删除</button>
        </div>
      </form>
    </dialog>

    <dialog id="unsaved-dialog" class="dialog">
      <form id="unsaved-form" method="dialog" class="dialog-body">
        <h3 class="dialog-title">未保存的更改</h3>
        <p class="dialog-message">当前笔记有未保存的更改，是否保存？</p>
        <div class="dialog-actions">
          <button id="unsaved-discard-btn" class="btn btn-ghost" type="button">不保存</button>
          <button id="unsaved-cancel-btn" class="btn btn-ghost" type="button">取消</button>
          <button id="unsaved-save-btn" class="btn btn-primary" type="submit">保存</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="./panel.js"></script>
  </body>
</html>
