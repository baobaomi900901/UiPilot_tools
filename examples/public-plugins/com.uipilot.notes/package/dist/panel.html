<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notes</title>
    <link rel="stylesheet" href="./panel.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="toolbar">
          <h2 class="toolbar-title">目录</h2>
          <button
            id="new-btn"
            class="btn btn-primary new-btn"
            type="button"
            title="新建笔记 (Ctrl+N)"
            aria-label="新建笔记"
          >
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <path d="M5 12h14"></path>
              <path d="M12 5v14"></path>
            </svg>
          </button>
        </div>

        <div
          id="note-list"
          class="note-list"
          role="listbox"
          tabindex="0"
          aria-label="笔记列表"
        >
          <div id="list-empty" class="list-empty" hidden>暂无笔记，按 Ctrl+N 新建</div>
          <div id="note-list-virtual" class="note-list-virtual" hidden>
            <div id="note-list-spacer" class="note-list-spacer"></div>
            <ul id="note-list-viewport" class="note-list-viewport"></ul>
          </div>
        </div>
      </aside>

      <section class="editor" aria-label="笔记编辑区">
        <div id="empty-state" class="empty-state">
          <div class="empty-icon" aria-hidden="true">✎</div>
          <p class="empty-title">还没有选中笔记</p>
          <p class="empty-hint">从左侧选择一条笔记，或按 Ctrl+N 开始记录。搜索请用主输入框并按 Enter。</p>
        </div>

        <div id="editor-panel" class="editor-panel" hidden>
          <div class="editor-surface">
            <textarea
              id="editor-content"
              class="editor-content"
              spellcheck="false"
              placeholder="在此记录笔记或代码片段…"
            ></textarea>
            <button
              id="editor-copy-btn"
              class="editor-copy-button"
              type="button"
              title="复制正文"
              aria-label="复制正文"
            >
              <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <rect width="14" height="14" x="8" y="8" rx="2" ry="2"></rect>
                <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"></path>
              </svg>
            </button>
          </div>
          <span id="editor-status" class="editor-status" role="status" aria-live="polite" aria-atomic="true"></span>
        </div>
      </section>
    </div>

    <dialog id="new-dialog" class="dialog">
      <form id="new-form" method="dialog" class="dialog-body">
        <h3 class="dialog-title">新建笔记</h3>
        <input
          id="new-title-input"
          class="text-input"
          type="text"
          aria-label="笔记名称"
          placeholder="例如：项目备忘、代码片段"
          autocomplete="off"
        />
        <div class="dialog-actions">
          <button id="new-save-btn" class="btn btn-primary" type="submit" aria-disabled="true">保存</button>
          <button id="new-cancel-btn" class="btn btn-ghost" type="button">取消</button>
        </div>
      </form>
    </dialog>

    <dialog id="delete-dialog" class="dialog">
      <form id="delete-form" method="dialog" class="dialog-body">
        <h3 class="dialog-title">确认删除</h3>
        <p id="delete-message" class="dialog-message"></p>
        <div class="dialog-actions">
          <button id="delete-cancel-btn" class="btn btn-ghost" type="button">取消</button>
          <button id="delete-confirm-btn" class="btn btn-danger" type="submit">删除</button>
        </div>
      </form>
    </dialog>

    <dialog id="unsaved-dialog" class="dialog">
      <form id="unsaved-form" method="dialog" class="dialog-body">
        <h3 class="dialog-title">未保存的更改</h3>
        <p class="dialog-message">当前笔记有未保存的更改，是否保存？</p>
        <div class="dialog-actions">
          <button id="unsaved-discard-btn" class="btn btn-ghost" type="button">不保存</button>
          <button id="unsaved-cancel-btn" class="btn btn-ghost" type="button">取消</button>
          <button id="unsaved-save-btn" class="btn btn-primary" type="submit">保存</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="./panel.js"></script>
  </body>
</html>
