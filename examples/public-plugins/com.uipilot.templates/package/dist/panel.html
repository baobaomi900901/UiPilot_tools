<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>文本模板</title>
    <link rel="stylesheet" href="./panel.css" />
    <link rel="stylesheet" href="./ui/ui.css" />
  </head>
  <body>
    <main class="uipilot-ui-layout">
      <aside class="uipilot-ui-sidebar" aria-label="已保存模板">
        <header class="uipilot-ui-toolbar">
          <h1>模板</h1>
          <button id="new" type="button" title="新建模板 (Ctrl+N)">新建模板</button>
        </header>
        <p id="filter" class="filter"></p>
        <nav id="list" class="uipilot-ui-list" aria-label="模板列表"></nav>
      </aside>
      <section class="uipilot-ui-detail" aria-label="模板编辑区">
        <header class="uipilot-ui-toolbar">
          <span id="draft-state" class="uipilot-ui-detail-label">未选择模板</span>
          <div class="uipilot-ui-actions">
            <button id="preview" type="button" disabled>预览</button>
            <button id="save" class="primary" type="button" disabled>保存</button>
          </div>
        </header>
        <div id="empty" class="empty">
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6M8 13h8M8 17h6"/></svg>
          <strong>还没有选中模板</strong>
          <p>选择已保存模板，或点击“新建模板”开始编辑。</p>
        </div>
        <div id="editor" class="editor" hidden>
          <label for="title">模板名称 <span>最多 80 个字符</span></label>
          <input id="title" type="text" placeholder="例如：问候语、周报开头" autocomplete="off" />
          <label for="body">正文 <span>使用 {{name}} 插入变量</span></label>
          <textarea id="body" rows="4" placeholder="你好，{{name}}！" spellcheck="false"></textarea>
          <fieldset id="samples">
            <legend>变量样例</legend>
            <p id="variable-hint" class="hint">编辑正文后点击“预览”发现变量。</p>
            <div id="variables" class="variables"></div>
          </fieldset>
          <label for="output">预览结果 <span>可选择并复制文本</span></label>
          <textarea id="output" rows="3" readonly placeholder="预览结果将在这里显示" spellcheck="false"></textarea>
        </div>
        <footer class="status-bar">
          <p id="status" role="status" aria-live="polite" aria-atomic="true">在主输入框按 Enter 筛选模板名称。</p>
          <button id="reload" type="button" hidden>重新载入已保存</button>
        </footer>
      </section>
    </main>
    <dialog id="discard-dialog" aria-labelledby="discard-title" aria-describedby="discard-message">
      <form method="dialog">
        <div class="dialog-heading">
          <h2 id="discard-title">放弃当前草稿？</h2>
          <button id="discard-close" type="button" aria-label="关闭" title="关闭"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12" /></svg></button>
        </div>
        <p id="discard-message"></p>
        <div class="dialog-actions">
          <button id="discard-cancel" type="button" autofocus>取消</button>
          <button value="discard">放弃并继续</button>
        </div>
      </form>
    </dialog>
    <script type="module" src="./panel.js"></script>
  </body>
</html>
