<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Demo Panel</title>
    <link rel="stylesheet" href="./panel.css" />
  </head>
  <body>
    <main>
      <h1>Public Plugin Demo Panel</h1>
      <dl>
        <div><dt>Input</dt><dd id="input"></dd></div>
        <div><dt>Platform</dt><dd id="platform"></dd></div>
        <div><dt>Theme</dt><dd id="theme"></dd></div>
        <div><dt>Request</dt><dd id="request"></dd></div>
        <div><dt>Stored input</dt><dd id="stored"></dd></div>
        <div><dt class="content-focus-label">Content focus</dt><dd><span id="focus-state" class="focus-state">Not focused</span></dd></div>
        <div><dt>Latest key</dt><dd id="latest-key">None</dd></div>
        <div><dt>Source</dt><dd id="key-source">None</dd></div>
        <div><dt>Events</dt><dd id="key-count">0</dd></div>
        <div><dt>Route sequence</dt><dd id="route-sequence">None</dd></div>
      </dl>
      <section class="key-history" aria-labelledby="key-history-title">
        <h2 id="key-history-title">Recent key events</h2>
        <ol id="key-history" aria-live="polite">
          <li class="key-history-empty">No key events yet</li>
        </ol>
      </section>
    </main>
    <script type="module" src="./panel.js"></script>
  </body>
</html>
