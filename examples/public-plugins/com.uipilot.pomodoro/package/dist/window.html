<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pomodoro Timer</title>
    <link rel="stylesheet" href="./window.css" />
  </head>
  <body>
    <main>
      <label class="duration-picker" for="duration">
        <span>计时长度</span>
        <select id="duration" aria-label="计时长度" disabled>
          <option value="10">10分钟</option>
          <option value="15">15分钟</option>
          <option value="25">25分钟</option>
          <option value="30">30分钟</option>
          <option value="45">45分钟</option>
        </select>
      </label>
      <p class="eyebrow">番茄钟</p>
      <output id="time" aria-live="off">10:00</output>
      <p id="status" class="status">准备</p>
      <div class="controls">
        <button id="start" type="button">开始</button>
        <button id="pause" type="button" disabled>暂停</button>
        <button id="reset" type="button" class="secondary">重置</button>
      </div>
      <p id="error" class="error" role="status"></p>
    </main>
    <script type="module" src="./window.js"></script>
  </body>
</html>
