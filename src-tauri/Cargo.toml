[package]
name = "uipilot"
default-run = "uipilot"
version = "0.3.3"
description = "Keyboard-first Windows application launcher"
authors = []
license = ""
repository = ""
edition = "2021"
rust-version = "1.96.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "uipilot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
test-instrumentation = []

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
bytes = "=1.12.1"
everything-ipc = { package = "everything-ipc-spike", path = "../spikes/everything-ipc" }
http-body-util = "=0.1.4"
hyper = { version = "=1.10.1", features = ["client", "http1", "server"] }
hyper-util = { version = "=0.1.20", features = ["tokio"] }
icu_casemap = { version = "=1.5.1", default-features = false, features = ["compiled_data"] }
native-tls = "=0.2.14"
rusqlite = { version = "=0.40.1", default-features = false, features = ["bundled"] }
schemars = "=1.2.1"
png = "=0.18.1"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
sha2 = "=0.10.9"
tauri = { version = "2.11.3", features = ["image-png", "tray-icon", "unstable"] }
time = { version = "0.3", features = ["formatting", "local-offset"] }
unicode-normalization = { version = "=0.1.23", default-features = false, features = ["std"] }
url = "=2.5.8"
zip = { version = "=2.4.2", default-features = false, features = ["flate2", "deflate-flate2"] }
windows = { version = "0.61.3", features = [
  "Data_Xml_Dom",
  "Foundation",
  "UI_Notifications",
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Imaging",
  "Win32_Media_Audio",
  "Win32_Security_Cryptography",
  "Win32_Storage_EnhancedStorage",
  "Win32_Storage_FileSystem",
  "Win32_Storage_Packaging_Appx",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_IO",
  "Win32_System_SystemInformation",
  "Win32_System_Time",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_System_WinRT",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_WindowsAndMessaging",
] }
tauri-plugin-dialog = "2"
tokio = { version = "=1.53.0", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-native-tls = "=0.3.1"
tokio-util = { version = "=0.7.18", features = ["rt"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
webview2-com = "=0.38.2"

[dev-dependencies]
rcgen = { version = "=0.14.8", default-features = false, features = ["crypto", "ring"] }
tokio-rustls = { version = "=0.26.4", default-features = false, features = ["ring", "tls12"] }

[profile.dev]
incremental = false
