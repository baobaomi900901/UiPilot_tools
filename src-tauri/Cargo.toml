[package]
name = "uipilot"
default-run = "uipilot"
version = "0.19.0"
description = "Keyboard-first Windows application launcher"
authors = []
license = ""
repository = ""
edition = "2021"
rust-version = "1.96.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
path = "src/platform.rs"
name = "uipilot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
custom-protocol = ["tauri/custom-protocol"]
test-instrumentation = []
fault-injection = []
installer-helper-build = []

[[bin]]
name = "uipilot-everything-installer"
path = "src/bin/uipilot-everything-installer/main.rs"
required-features = ["installer-helper-build"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
bytes = "=1.12.1"
chrono = "0.4.45"
chrono-tz = { version = "0.10.4", features = ["case-insensitive"] }
http-body-util = "=0.1.4"
hyper = { version = "=1.10.1", features = ["client", "http1", "server"] }
hyper-util = { version = "=0.1.20", features = ["tokio"] }
icu_casemap = { version = "=1.5.1", default-features = false, features = ["compiled_data"] }
native-tls = "=0.2.14"
rusqlite = { version = "=0.40.1", default-features = false, features = ["bundled"] }
rust_decimal = "1.43.0"
schemars = "=1.2.1"
png = "=0.18.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde_json = { version = "1.0", features = ["raw_value"] }
serde = { version = "1.0", features = ["derive"] }
sha2 = "=0.10.9"
tauri = { version = "2.11.3", features = ["image-png", "tray-icon", "unstable"] }
time = { version = "0.3", features = ["formatting", "local-offset"] }
unicode-normalization = { version = "=0.1.23", default-features = false, features = ["std"] }
url = "=2.5.8"
zip = { version = "=2.4.2", default-features = false, features = ["flate2", "deflate-flate2"] }
tauri-plugin-dialog = "2"
tokio = { version = "=1.53.0", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-native-tls = "=0.3.1"
tokio-rustls = { version = "=0.26.4", default-features = false, features = ["ring", "tls12"] }
tokio-util = { version = "=0.7.18", features = ["rt"] }
webpki-roots = "=1.0.9"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"

[target.'cfg(target_os = "macos")'.dependencies]
base64 = "=0.22.1"
block2 = "=0.6.2"
objc2 = "=0.6.4"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSBundle", "NSDictionary", "NSString", "NSURL"] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSWorkspace", "NSRunningApplication", "block2"] }
plist = "=1.10.0"
rustix = { version = "=1.1.4", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
everything-ipc = { package = "everything-ipc-spike", path = "../spikes/everything-ipc" }
webview2-com = "=0.38.2"
windows = { version = "0.61.3", features = [
  "ApplicationModel_DataTransfer",
  "Data_Xml_Dom",
  "Foundation",
  "UI_Notifications",
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Imaging",
  "Win32_Media_Audio",
  "Win32_Media_Speech",
  "Win32_Security_Cryptography",
  "Win32_Security_Authorization",
  "Win32_Storage_EnhancedStorage",
  "Win32_Storage_FileSystem",
  "Win32_Storage_Packaging_Appx",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_DataExchange",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_IO",
  "Win32_System_LibraryLoader",
  "Win32_System_JobObjects",
  "Win32_System_Memory",
  "Win32_System_RemoteDesktop",
  "Win32_System_SystemInformation",
  "Win32_System_Time",
  "Win32_System_Threading",
  "Win32_System_Services",
  "Win32_Security_Authorization",
  "Win32_Security_WinTrust",
  "Win32_System_Variant",
  "Win32_System_WinRT",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_System_Registry",
  "Win32_System_Pipes",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_HiDpi",
  "Win32_UI_Controls",
  "Win32_UI_Accessibility",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tauri = { version = "2.11.3", features = ["test"] }
rcgen = { version = "=0.14.8", default-features = false, features = ["crypto", "ring"] }

[profile.dev]
incremental = false
